[package]
name = "python-dotenvx-native"
version = "2.0.1"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
dotenvx-ll = { path = "../forge/dotenvx-ll" }
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py38"] }
