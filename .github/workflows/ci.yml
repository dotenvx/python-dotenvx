name: publish
run-name: Python release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Forge-generated release tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish missing wheels after validation (false only tests)
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python .github/scripts/release.py verify

  test:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
            architecture: x64
          - os: ubuntu-24.04
            python: '3.13'
            architecture: x64
          - os: ubuntu-24.04-arm
            python: '3.13'
            architecture: arm64
          - os: macos-15-intel
            python: '3.8'
            architecture: x64
          - os: macos-15-intel
            python: '3.13'
            architecture: x64
          - os: macos-15
            python: '3.13'
            architecture: arm64
          - os: windows-2022
            python: '3.8'
            architecture: x64
          - os: windows-2022
            python: '3.13'
            architecture: x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - run: python .github/scripts/release.py verify
      - name: Install the matching prebuilt wheel and run tests
        run: |
          python -c "import os, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', '--no-index', '--find-links', 'dist', 'python-dotenvx==' + os.environ['RELEASE_TAG'][1:]])"
          python -m pip install pytest
          python -m pytest -q tests

  publish:
    needs: [validate, test]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    environment: release
    concurrency: python-dotenvx-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate release and prepare missing wheels
        id: upload
        env:
          PUBLISH: ${{ inputs.publish }}
        run: python .github/scripts/release.py prepare-upload
      - name: Publish missing wheels to PyPI using OIDC
        if: steps.upload.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .pypi-upload/
